name: Generate Signing Key (One Time)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-key:
    runs-on: ubuntu-latest

    steps:
      - name: Check required passwords
        env:
          KEYSTORE_PASSWORD: ${{ secrets.WFG_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.WFG_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Required signing secrets are missing."
            exit 1
          fi

      - name: Generate permanent signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.WFG_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.WFG_KEY_PASSWORD }}
        run: |
          set -eu
          keytool -genkeypair -v \
            -keystore wfg-signing.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias whatsappfeatureguard \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=WhatsApp Feature Guard, OU=Android, O=Personal, L=Unknown, ST=Unknown, C=IL"

      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: wfg-signing-key
          path: wfg-signing.jks
          retention-days: 1
